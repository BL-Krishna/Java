<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Example</title>
    <link rel="stylesheet" href="forms.css"></link>
</head>
<body>
    <form class="formmain" novalidate>
    <header class="headerContainer"><h1>HTML5 Form Input Fields</h1></header><br>

    <div>
        <label for="text">Name: </label>
        <input type="text" id="text" name="text" required>
        <error-output class="text-error"></error-output>
    </div>

    <div>
        <label for="pwd">Password</label>
        <input type="password" id="pwd" name="pwd" required>
        <error-output class="pwd-error"></error-output>
    </div>

    <div>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
        <error-output class="email-error"></error-output>
    </div>

    <div>
        <label for="url">URL</label>
        <input type="url" id="url" name="url">
    </div>

    <div>
        <label for="number">Number Input</label>
        <input type="number" id="number" name="number">
    </div>

    <div>
        <label for="tel">Telephone</label>
        <input type="tel" id="tel" name="tel" placeholder="91 9919819801" required>
        <error-output class="tel-error"></error-output>
    </div>

    <div>
        <label for="search">Search</label>
        <input type="search" id="search" name="search">
    </div>

    <div class="nativeDateTimePicker">
        <label for="party">Choose Date and Time</label>
        <input type="datetime-local" id="party" name="bday">
        <span class="validity"></span>
    </div>

    <div>
        <label for="salary">Choose your salary:</label>
        <input type="range" name="salary" id="salary" min="30000" max="500000" step="100" value="40000">
        <output class="salary-output" for="salary">40000</output>
    </div>

    <div class="btn-container">
        <button type="submit">Submit</button>
    </div>
</form>

</body>
<script>
const form = document.querySelector('form');

/* ---------- UTILITY ---------- */
function setValid(input, errorEl) {
    input.classList.remove('invalid');
    input.classList.add('valid');
    errorEl.textContent = "";
}

function setInvalid(input, errorEl, message) {
    input.classList.remove('valid');
    input.classList.add('invalid');
    errorEl.textContent = message;
}

/* ---------- NAME ---------- */
const nameInput = document.querySelector('#text');
const nameError = document.querySelector('.text-error');

nameInput.addEventListener('input', validateName);
nameInput.addEventListener('blur', validateName);

function validateName() {
    const regex = /^[A-Z][a-z]{2,}$/;
    regex.test(nameInput.value)
        ? setValid(nameInput, nameError)
        : setInvalid(nameInput, nameError, "Start with capital & min 3 letters");
}

/* ---------- EMAIL ---------- */
const emailInput = document.querySelector('#email');
const emailError = document.querySelector('.email-error');

emailInput.addEventListener('input', validateEmail);
emailInput.addEventListener('blur', validateEmail);

function validateEmail() {
    const regex = /^[a-z]+(\.[a-z]+)?@[a-z]+\.[a-z]{2,}(\.[a-z]{2})?$/;
    regex.test(emailInput.value)
        ? setValid(emailInput, emailError)
        : setInvalid(emailInput, emailError, "Invalid email format");
}

/* ---------- MOBILE ---------- */
const telInput = document.querySelector('#tel');
const telError = document.querySelector('.tel-error');

telInput.addEventListener('input', validateTel);
telInput.addEventListener('blur', validateTel);

function validateTel() {
    const regex = /^[0-9]{2}\s[0-9]{10}$/;
    regex.test(telInput.value)
        ? setValid(telInput, telError)
        : setInvalid(telInput, telError, "Format: 91 9919819801");
}

/* ---------- PASSWORD ---------- */
const pwdInput = document.querySelector('#pwd');
const pwdError = document.querySelector('.pwd-error');

pwdInput.addEventListener('input', validatePwd);
pwdInput.addEventListener('blur', validatePwd);

function validatePwd() {
    const pwd = pwdInput.value;
    const rule1 = pwd.length >= 8;
    const rule2 = /[A-Z]/.test(pwd);
    const rule3 = /\d/.test(pwd);
    const rule4 = (pwd.match(/[^a-zA-Z0-9]/g) || []).length === 1;

    rule1 && rule2 && rule3 && rule4
        ? setValid(pwdInput, pwdError)
        : setInvalid(
            pwdInput,
            pwdError,
            "8 chars, 1 uppercase, 1 number & exactly 1 special char"
        );
}

/* ---------- SALARY ---------- */
const salary = document.querySelector('#salary');
const output = document.querySelector('.salary-output');

output.textContent = salary.value;
salary.addEventListener('input', () => {
    output.textContent = salary.value;
});

/* ---------- FORM SUBMIT ---------- */
form.addEventListener('submit', (e) => {
    validateName();
    validateEmail();
    validateTel();
    validatePwd();

    if (form.querySelectorAll('.invalid').length > 0) {
        e.preventDefault();
        alert("Please fix errors before submitting ❌");
    } else {
        alert("Form submitted successfully ✅");
    }
});
</script>

</html>
