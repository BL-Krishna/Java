<!DOCTYPE html>
<html>
<head>
  <title>Employee Payroll</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="header">
  <div class="logo">
    <span>EMPLOYEE</span>
    <strong>PAYROLL</strong>
  </div>

  <div class="right">
    <span class="count">Employee Count : <b id="empCount">0</b></span>
    <a href="payroll_form.html" class="btn primary">+ Add User</a>
  </div>
</header>


<main class="container">

  <h2>Employee Details</h2>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Gender</th>
        <th>Department</th>
        <th>Salary</th>
        <th>Start Date</th>
        <th>Actions</th>
      </tr>
    </thead>

    <tbody id="employeeTable"></tbody>
  </table>

</main>


<script src="js/emp_json.js"></script>
<script src="js/utility.js"></script>
<script src="js/home.js"></script>

</body>
</html>
