<!DOCTYPE html>
<html>
<head>
  <title>Employee Payroll Form</title>

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

<header class="header">
  <div class="logo">
    <span>EMPLOYEE</span>
    <strong>PAYROLL</strong>
  </div>
</header>

<div class="form-card">

<h2>Employee Payroll Form</h2>

<form id="empForm">

<label>Name</label>
<input type="text" id="name" required>

<label>Gender</label>
<div>
  <input type="radio" name="gender" value="Male"> Male
  <input type="radio" name="gender" value="Female"> Female
</div>

<label>Department</label>
<div>
  <input type="checkbox" value="HR"> HR
  <input type="checkbox" value="Sales"> Sales
  <input type="checkbox" value="Finance"> Finance
  <input type="checkbox" value="Engineer"> Engineer
</div>

<label>Salary</label>
<select id="salary">
  <option value="10000">₹ 10,000</option>
  <option value="20000">₹ 20,000</option>
  <option value="30000">₹ 30,000</option>
</select>

<label>Start Date</label>
<input type="date" id="startDate">

<label>Notes</label>
<textarea id="notes"></textarea>

<div class="form-btns">
  <a href="index.html" class="btn">Cancel</a>
  <button type="submit" class="btn primary">Submit</button>
  <button type="reset" class="btn">Reset</button>
</div>

</form>

</div>


<script src="js/emp_json.js"></script>
<script src="js/utility.js"></script>
<script src="js/payrollform.js"></script>

</body>
</html>
